name: Dotfiles CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catch breakage caused by new macOS images and Homebrew updates.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Check out dotfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Render into a clean home directory
        run: |
          destination="$RUNNER_TEMP/chezmoi-home"
          mkdir -p "$destination"
          export HOME="$destination"

          chezmoi \
            --source="$GITHUB_WORKSPACE" \
            --destination="$destination" \
            --no-tty \
            apply --dry-run >/dev/null

          chezmoi \
            --source="$GITHUB_WORKSPACE" \
            --destination="$destination" \
            --no-tty \
            apply --exclude=scripts

          chezmoi \
            --source="$GITHUB_WORKSPACE" \
            --destination="$destination" \
            --no-tty \
            verify --exclude=scripts

          echo "CHEZMOI_DESTINATION=$destination" >> "$GITHUB_ENV"

      - name: Validate rendered files and scripts
        run: |
          set -eu

          # Parse every Brewfile declaration without installing the bundle.
          brew bundle list --file="$GITHUB_WORKSPACE/Brewfile" --all >/dev/null

          export HOME="$CHEZMOI_DESTINATION"
          zsh -n "$CHEZMOI_DESTINATION/.zshrc"
          if grep -R -F '/Users/bthorne' \
            "$CHEZMOI_DESTINATION/.zshrc" \
            "$CHEZMOI_DESTINATION/.config" \
            "$CHEZMOI_DESTINATION/.ssh" \
            "$CHEZMOI_DESTINATION/.pi"; then
            echo 'Rendered files contain a machine-specific home path' >&2
            exit 1
          fi
          grep -F "$CHEZMOI_DESTINATION/.config/iterm2" \
            "$CHEZMOI_DESTINATION/.config/iterm2/com.googlecode.iterm2.plist" >/dev/null
          test ! -e "$CHEZMOI_DESTINATION/.codex/config.toml"
          bash -n "$CHEZMOI_DESTINATION/.claude/statusline-starship.sh"

          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find "$CHEZMOI_DESTINATION" -type f -name '*.json' -print0)

          while IFS= read -r -d '' file; do
            python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text())' "$file"
          done < <(find "$CHEZMOI_DESTINATION" -type f -name '*.toml' -print0)

          while IFS= read -r -d '' file; do
            plutil -lint "$file"
          done < <(find "$CHEZMOI_DESTINATION" -type f \( -name '*.plist' -o -name '*.itermcolors' \) -print0)

          while IFS= read -r -d '' file; do
            node --experimental-strip-types --check "$file"
          done < <(find "$CHEZMOI_DESTINATION" -type f -name '*.ts' -print0)

          while IFS= read -r target; do
            rendered=$(mktemp)
            chezmoi \
              --source="$GITHUB_WORKSPACE" \
              --destination="$CHEZMOI_DESTINATION" \
              cat "$target" > "$rendered"
            case "$(head -n 1 "$rendered")" in
              *bash*) bash -n "$rendered" ;;
              *sh*) sh -n "$rendered" ;;
              *) echo "Unsupported script interpreter: $target" >&2; exit 1 ;;
            esac
            rm -f "$rendered"
          done < <(
            chezmoi \
              --source="$GITHUB_WORKSPACE" \
              --destination="$CHEZMOI_DESTINATION" \
              managed --include=scripts --path-style=absolute
          )

  validate-linux:
    name: Render and validate on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dotfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi and zsh
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Render into a clean home directory
        run: |
          destination="$RUNNER_TEMP/chezmoi-home"
          mkdir -p "$destination"
          export HOME="$destination"
          chezmoi="$RUNNER_TEMP/bin/chezmoi"

          "$chezmoi" --source="$GITHUB_WORKSPACE" --destination="$destination" --no-tty \
            apply --exclude=scripts
          "$chezmoi" --source="$GITHUB_WORKSPACE" --destination="$destination" --no-tty \
            verify --exclude=scripts
          echo "CHEZMOI_DESTINATION=$destination" >> "$GITHUB_ENV"

      - name: Validate rendered files and scripts
        run: |
          set -eu
          export HOME="$CHEZMOI_DESTINATION"
          chezmoi="$RUNNER_TEMP/bin/chezmoi"

          zsh -n "$CHEZMOI_DESTINATION/.zshrc"
          ssh -G -F "$CHEZMOI_DESTINATION/.ssh/config" example.invalid >/dev/null
          if grep -R -F -e '/Users/bthorne' -e '/home/bthorne' \
            "$CHEZMOI_DESTINATION/.zshrc" "$CHEZMOI_DESTINATION/.config" \
            "$CHEZMOI_DESTINATION/.ssh" "$CHEZMOI_DESTINATION/.pi"; then
            echo 'Rendered files contain a machine-specific home path' >&2
            exit 1
          fi
          python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text())' \
            "$CHEZMOI_DESTINATION/.config/starship.toml"
          grep -F 'default = "box"' "$CHEZMOI_DESTINATION/.config/starship.toml" >/dev/null
          python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text())' \
            "$CHEZMOI_DESTINATION/.codex/config.toml"
          # The settings merge scripts must produce valid JSON from an empty start.
          python3 -m json.tool "$CHEZMOI_DESTINATION/.claude/settings.json" >/dev/null
          python3 -m json.tool "$CHEZMOI_DESTINATION/.pi/agent/settings.json" >/dev/null
          bash -n "$CHEZMOI_DESTINATION/.claude/statusline-starship.sh"

          # macOS-only targets must not render on Linux.
          for absent in Brewfile Library .config/iterm2 .local/bin/ensure-nomad-mount .local/bin/desk-mount; do
            if [ -e "$CHEZMOI_DESTINATION/$absent" ]; then
              echo "macOS-only target rendered on Linux: $absent" >&2
              exit 1
            fi
          done

          while IFS= read -r target; do
            rendered=$(mktemp)
            "$chezmoi" --source="$GITHUB_WORKSPACE" --destination="$CHEZMOI_DESTINATION" \
              cat "$target" > "$rendered"
            case "$(head -n 1 "$rendered")" in
              *bash*) bash -n "$rendered" ;;
              *sh*) sh -n "$rendered" ;;
              *) echo "Unsupported script interpreter: $target" >&2; exit 1 ;;
            esac
            rm -f "$rendered"
          done < <(
            "$chezmoi" --source="$GITHUB_WORKSPACE" --destination="$CHEZMOI_DESTINATION" \
              managed --include=scripts --path-style=absolute
          )

  bootstrap:
    name: Bootstrap a fresh Mac
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HOMEBREW_BUNDLE_NO_UPGRADE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Check out dotfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the bootstrap binary
        run: |
          installer="$RUNNER_TEMP/install-chezmoi.sh"
          curl -fsSL https://get.chezmoi.io -o "$installer"
          sh "$installer" -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/chezmoi" --version

      - name: Initialize and apply from scratch
        run: |
          # Runner images can lag current bottle metadata; a new Homebrew install cannot.
          brew update
          test "$(uname -m)" = arm64
          bootstrap_home="$RUNNER_TEMP/bootstrap-home"
          mkdir -p "$bootstrap_home"
          HOME="$bootstrap_home" \
            "$RUNNER_TEMP/bin/chezmoi" \
            --no-tty \
            init --apply "file://$GITHUB_WORKSPACE"
          echo "BOOTSTRAP_HOME=$bootstrap_home" >> "$GITHUB_ENV"

      - name: Verify the installed state
        run: |
          HOME="$BOOTSTRAP_HOME" \
            "$RUNNER_TEMP/bin/chezmoi" \
            --no-tty \
            verify --exclude=scripts
          brew bundle check --file="$BOOTSTRAP_HOME/.local/share/chezmoi/Brewfile"
          test -x "$BOOTSTRAP_HOME/.local/share/gh/extensions/gh-dash/gh-dash"
          "$BOOTSTRAP_HOME/.local/share/gh/extensions/gh-dash/gh-dash" --version
          test -d /Applications/iTerm.app
          test -d '/Applications/Visual Studio Code.app'
          HOME="$BOOTSTRAP_HOME" code --list-extensions \
            | grep -Fx 'arcticicestudio.nord-visual-studio-code'
          HOME="$BOOTSTRAP_HOME" zsh -ic '
            command -v brew
            command -v code
            command -v opencode
            command -v pi
            command -v starship
            test -r "$(brew --prefix)/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh"
          '
